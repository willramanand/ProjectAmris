name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: this PR-triggered workflow is read-only. No packages:write /
# publish here — publishing is a separate Phase 6 concern (threat T-01-01).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (jsdom + coverage gate)
        run: npx vitest run --project jsdom --coverage

      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Browser lane (real ElementInternals + in-browser axe)
        run: npm run test:browser

  surface-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build manifest
        run: npm run build:manifest # emits dist/custom-elements.json

      # Regenerate the frozen-contract doc from the fresh CEM and fail if the
      # committed copy is stale — docs/contract.md can never drift from the
      # enforced surface (D-05, threat T-05-02). Read-only: no write-back.
      - name: Contract doc drift check
        run: |
          npm run build:contract-doc
          git diff --exit-code docs/contract.md

      # Enforcing surface-diff release gate (SHIP-01). The script exits non-zero
      # when the public surface drifts from the baseline and no pending Changeset
      # accompanies it. No continue-on-error and no `|| true` — a non-zero exit
      # fails the job, blocking any unversioned public-surface change.
      - name: Surface diff (release gate)
        run: npm run diff:surface

  # Report-only runtime-perf lane (MEAS-02/03). Kept a SIBLING job — not folded
  # into `browser` — to isolate the CDP write+exec privilege and the Chromium-only
  # throttling constraint from the correctness lane (Open Question 3).
  #
  # Node 20 (NOT 22): the perf lane needs only Playwright/Chromium and must stay on
  # a pinned Node so throttled baselines don't drift when the runner Node moves
  # (Pitfall 5). Only the `size` job below runs Node 22 (size-limit@13 needs >=22.18).
  #
  # Report-only (D-08): perf-diff.mjs exits 0 by design this phase — numbers post on
  # every PR, nothing red-builds. The enforcing flip is Phase 11. Report-only is
  # achieved purely by the script's exit 0 — no error-suppressing step flag and no
  # `|| true` are used (those would fake report-only and mask a real failure later).
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Perf harness (Chromium, throttled) — report-only
        run: |
          npm run test:perf
          node scripts/perf-diff.mjs api/perf.baseline.json api/perf.json

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # size-limit@13 requires Node >=22.18; the rest of CI stays on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run size

  # Packed-artifact smoke (SHIP-03): pack -> install into a throwaway project ->
  # resolve the full/per-component/tokens.css matrix (raw ESM + a real esbuild
  # bundle). Proves every documented entry resolves from an install and Lit is
  # never inlined. Node 20 only; inherits the read-only top-level permissions —
  # this PR-triggered job never sees a publish credential (threat T-06-06).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tarball resolution smoke
        run: npm run smoke
