name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: this PR-triggered workflow is read-only. No packages:write /
# publish here — publishing is a separate Phase 6 concern (threat T-01-01).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (jsdom + coverage gate)
        run: npx vitest run --project jsdom --coverage

      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium + WebKit + Firefox
        run: npx playwright install chromium webkit firefox

      - name: Browser lane (real ElementInternals + in-browser axe)
        run: npm run test:browser

  surface-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build manifest
        run: npm run build:manifest # emits dist/custom-elements.json

      # Regenerate the frozen-contract doc from the fresh CEM and fail if the
      # committed copy is stale — docs/contract.md can never drift from the
      # enforced surface (D-05, threat T-05-02). Read-only: no write-back.
      - name: Contract doc drift check
        run: |
          npm run build:contract-doc
          git diff --exit-code docs/contract.md

      # Regenerate the cost cards from the committed measured baselines and fail
      # if the committed copy is stale — docs/cost-cards.md can never drift from
      # the enforced api/*.baseline.json numbers (DOCS-04, threat T-11-08). Reads
      # baselines only (never re-measures). Deterministic like the contract-doc
      # gate — a regenerated doc either matches the committed copy or it does not —
      # so it BLOCKS from the start (no soak wrapper).
      - name: Cost-cards drift check
        run: |
          node scripts/build-cost-cards.mjs
          git diff --exit-code docs/cost-cards.md

      # Enforcing surface-diff release gate (SHIP-01). The script exits non-zero
      # when the public surface drifts from the baseline and no pending Changeset
      # accompanies it. No continue-on-error and no `|| true` — a non-zero exit
      # fails the job, blocking any unversioned public-surface change.
      - name: Surface diff (release gate)
        run: npm run diff:surface

  # Enforcing (soaking) runtime-perf lane (GATE-02/GATE-03). Kept a SIBLING job —
  # not folded into `browser` — to isolate the CDP write+exec privilege and the
  # Chromium-only throttling constraint from the correctness lane (Open Question 3).
  #
  # Node 20 (NOT 22): the perf lane needs only Playwright/Chromium and must stay on
  # a pinned Node so throttled baselines don't drift when the runner Node moves
  # (Pitfall 5). Only the `size` job below runs Node 22 (size-limit@13 needs >=22.18).
  #
  # GATE-02: perf-diff.mjs now runs with --enforce — it exits 1 on any COUNT drift
  # from the committed api/perf.baseline.json (wall-clock is structurally excluded and
  # can never gate). The enforcing exit reaches the job via the script's own exit code:
  # NO error-suppressing step flag and no `|| true` on the harness step.
  perf:
    runs-on: ubuntu-latest
    # SOAK-ONLY (GATE-03): the enforcing perf count gate below is soak-staged. A
    # job-level continue-on-error lets a count regression annotate this job red
    # WITHOUT flipping the CI workflow-run conclusion to failure, so release.yml's
    # `workflow_run.conclusion == 'success'` publish gate stays reachable while the
    # cross-CI-run count stability of the timing-derived tick counts
    # (computePosition/repositions) is characterized (RESEARCH Open Question 1).
    # REMOVE this line to make the perf count gate hard-blocking once the soak shows
    # zero cross-run variance — counts-second, AFTER the deterministic `size` gate
    # un-soaks first. Do NOT leave this wrapper on permanently — a forever
    # continue-on-error is a fake report-only that masks a real regression.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      # NOTE: the test:perf specs may hard-assert exact counts (e.g. overlay
      # computePosition===4, repositions===2) and can fail the vitest step BEFORE
      # perf-diff --enforce runs. During the soak that is fine — the whole job is
      # continue-on-error — but the single budget authority is `perf-diff --enforce`
      # (Pitfall 3): it is the one place that compares against the committed baseline.
      - name: Perf harness (Chromium, throttled) — count gate (enforcing, soaking)
        run: |
          npm run test:perf
          node scripts/perf-diff.mjs api/perf.baseline.json api/perf.json --enforce

  size:
    runs-on: ubuntu-latest
    # SOAK-ONLY (GATE-03): the enforcing brotli size gate below is soak-staged. A
    # job-level continue-on-error lets a size regression annotate this job red
    # WITHOUT flipping the CI workflow-run conclusion to failure, so release.yml's
    # `workflow_run.conclusion == 'success'` publish gate stays reachable during
    # the soak. Size is deterministic so its soak is short; REMOVE this line to
    # make the size gate hard-blocking once the soak confirms no flakiness. Do NOT
    # leave this wrapper on permanently — a forever continue-on-error is a fake
    # report-only that masks a real regression (repo discipline, ci.yml above).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # size-limit@13 requires Node >=22.18; the rest of CI stays on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run size

      # GATE-01: the per-entry brotli baseline is now ENFORCING — `--enforce` exits
      # 1 on a positive-delta regression beyond tolerance (max(16 B, 0.5% of
      # baseline) per row), red-annotating this job. It reads the committed
      # api/size.baseline.json only (never writes it). The regression is contained
      # to a job-level continue-on-error soak (above) so it cannot block a publish
      # (GATE-03). NO error-suppressing flag and no `|| true` on the step itself —
      # the enforcing exit code must reach the job. The remaining guards below stay
      # report-only (they exit 0 by design; their numbers post on every PR).
      - name: Brotli size regression gate (enforcing, soaking)
        run: node scripts/size-baseline.mjs --enforce

      # MEAS-04b: no-bundled-Lit guard, independent of size-limit (size-limit
      # ignores `lit`, so an inlined copy would be invisible to the budget above).
      - name: No-bundled-Lit assertion (report-only)
        run: node scripts/assert-no-bundled-lit.mjs

      # MEAS-05: @size-limit/esbuild-why --why cost breakdown — confirms what pulls
      # into each shipped chunk (e.g. highlight.js ships nowhere). Node-22 size lane.
      - name: Bundle attribution --why (report-only)
        run: npm run size:why

  # Packed-artifact smoke (SHIP-03): pack -> install into a throwaway project ->
  # resolve the full/per-component/tokens.css matrix (raw ESM + a real esbuild
  # bundle). Proves every documented entry resolves from an install and Lit is
  # never inlined. Node 20 only; inherits the read-only top-level permissions —
  # this PR-triggered job never sees a publish credential (threat T-06-06).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tarball resolution smoke
        run: npm run smoke
